<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Medical Emergency Finder</title>
   <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
   <style>
       
       body { font-family: 'Times New Roman', Times, serif; margin: 0; padding: 0; }
       #map { height: 400px; width: 100%; border: 1px solid #ccc; margin-bottom: 10px; }
       .container { padding: 20px; }
       .hospital-list { list-style: none; padding: 0; }
       .hospital-list li { border: 1px solid #eee; padding: 10px; margin-bottom: 5px; }
       
       .medical-need-button {
           margin: 5px;
           padding: 10px 20px;
           font-size: 16px;
           cursor: pointer;
           border: 1px solid #ccc;
           background-color: #f9f9f9;
           border-radius: 5px;
       }
       .medical-need-button:hover {
           background-color: #e0e0e0;
       }
       #medicalNeeds {
           display: grid;
           grid-template-columns: 1fr 1fr;
           gap: 10px;
           max-width: 400px;
           margin: 0 auto 20px auto;
       }
       @media (max-width: 600px) {
           .container {
               padding: 8px;
           }
           #map {
               height: 250px;
           }
           #medicalNeeds {
               grid-template-columns: 1fr;
               max-width: 100%;
               gap: 8px;
           }
           .medical-need-button {
               font-size: 15px;
               padding: 10px 0;
           }
           h1, h2 {
               font-size: 1.2em;
           }
       }
   </style>
</head>
<body>
   <div class="container">
       <h1>Fine Medical Help</h1>

       <button id="centerLocationBtn" class="medical-need-button" style="margin-bottom:10px;">Center on My Location</button>

       <div id="map"></div>

       <div>
           <h2>Select Medical Need:</h2>
           <div id="medicalNeeds">
               <button class="medical-need-button" data-need="anti-rabies">Anti-Rabies Shot</button>
               <button class="medical-need-button" data-need="dental">Dental Emergency</button>
               <button class="medical-need-button" data-need="burns">Minor Burn Care</button>
               <button class="medical-need-button" data-need="general-checkup">General Checkup</button>
               <button class="medical-need-button" data-need="diagnostics">Diagnostics</button>
               <button class="medical-need-button" data-need="urgent-care">Urgent Care</button>
               <button class="medical-need-button" data-need="pediatrics">Pediatrics</button>
           </div>
       </div>

       <h2>Nearby Facilities:</h2>
       <ul id="hospitalList" class="hospital-list">
           <li>No facilities found yet.</li>
       </ul>
   </div>


   <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

   <script src="script.js"></script>
</body>
</html>
